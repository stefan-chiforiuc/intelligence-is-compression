# Defaults for the training app. Every value here is overridden per-scenario by
# demos/spring-boot/run.sh, which is the point: these are the knobs.

server.port=8080

# --- The request thread pool -------------------------------------------------
# Tomcat's default is 200. That number is a guess someone made in 2005 and
# almost nobody has ever revisited it. It caps how many requests can be IN
# FLIGHT; everything beyond it waits in the accept queue.
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# --- Virtual threads (Spring Boot 3.2+, needs JDK 21) ------------------------
# Flip this to true and Tomcat serves each request on a virtual thread instead
# of borrowing one from the pool above. threads.max then stops being a ceiling
# on concurrency - which is exactly the trap the database block warns about.
spring.threads.virtual.enabled=false

# --- Database (optional) -----------------------------------------------------
# Points at the training container from demos/db-scaling. The app must still
# start when no database is running, so failures are deferred to /db.
spring.datasource.url=${TRAINING_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/training}
spring.datasource.username=${TRAINING_DB_USER:training}
spring.datasource.password=${TRAINING_DB_PASS:training}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
# -1 = never fail startup because the database is down.
spring.datasource.hikari.initialization-fail-timeout=-1

# --- Observability -----------------------------------------------------------
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# Quieter startup so the "Started TrainingApp in X seconds" line is easy to see.
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.training=INFO
logging.level.org.springframework.boot.StartupInfoLogger=INFO
